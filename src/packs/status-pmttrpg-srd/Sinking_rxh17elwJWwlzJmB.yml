system:
  name: ''
  description: "<p dir=\"ltr\">When hit by an Attack, the attacker may choose to proc this status. Take SP Damage equal to the number of Sinking stacks, then remove all Sinking. This is considered a Sinking Burst for effects that refer to it. If this Sinking Burst results in the target’s Panic, the attacker can choose what Panic type the target enters.</p><p><strong>\_</strong></p><p dir=\"ltr\">If you do not have SP (this does not count for characters at 0 SP), take HP Damage instead during a Sinking Burst.</p><p><strong>\_</strong></p><p dir=\"ltr\">At the end of Round, remove all Sinking.</p><p>\_</p>"
  slug: ''
  stacks: 1
  stackMax: 0
  priority: 5
  pending: false
  arrival: ''
  shelved: false
  origin: ''
  customNotes: ''
  easyEffects: |-
    [On Being Hit]
    create dialog "Proc Sinking Burst?":
      burst as "Burst",
      skip as "Do not burst"
      to attacker

    [On Dialog Answer burst]
    burst Sinking on self

    [On Burst]
    deal (burst.amount) sp damage to self
    lose all Sinking on self

    [End of Round]
    lose all Sinking on self
