  customNotes: ''
  easyEffects: |-
    [On Applied]
    proc SelfStagger on self;
    create dialog "Self-Stagger : Deal SP Damage to Self?":
      selfSpDamage as "Deal 5 SP Damage to Self",
      dont as "Don't"
      to self;
    heal 1 light to self;

    [On Dialog Answer selfSpDamage]
    deal 5 sp damage to self;

    [Always Active]
    set resistances to fatal;

    [On Removed]
    set st to max;
    gain 10 tempSt on self;
