  description: >-
    <h4>Panic Behavior</h4><p>On their turn, the Character must move adjacent to
    the nearest Target (chosen at random between nearest available Targets) and
    take the Protect Action. If they have any additional Actions, they must
    convert them into Reactions. While Protecting, the Character must intercept
    clashes for any Target within range, including enemies.</p><p>When this
    Character recovers from being Staggered, immediately
    unpanic.</p><hr><h4>Goaded Panic</h4><p>The Character can be forced to use
    the Protect Action on a specific Target by the Provoker.</p>
