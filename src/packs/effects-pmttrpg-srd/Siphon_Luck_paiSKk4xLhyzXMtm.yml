  procCondition: ''
  positive: >-
    <p>Transfer up to [N] already present stacks of Poise from self to the
    target OR from target to self.</p>
  negative: ''
  macro:
    uuid: ''
  customNotes: ''
  easyEffects: |-
    [On Clash Win With Attack]
    create dialog "Siphon Luck: Transfer Poise?":
      transferStT as "Transfer from Self to Target",
      transferTtS as "Transfer from Target to Self"
      to self;

    [On Dialog Answer transferStT]
    require (self.status.Poise) > 0 and (self.status.Poise) < N then
      inflict (self.status.Poise) Poise on target and lose all Poise on self;
    require (self.status.Poise) >= N then
      inflict N Poise on target and lose N Poise on self;

    [On Dialog Answer transferTtS]
    require (target.status.Poise) > 0 and (target.status.Poise) < N then
      gain (target.status.Poise) Poise on self and lose all Poise on target;
    require (target.status.Poise) >= N then
      gain N Poise on self and lose N Poise on target;
