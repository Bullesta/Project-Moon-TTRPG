  customNotes: ''
  easyEffects: |-
    [On Clash Win With Attack]
    create dialog "Siphon Curse: Transfer Ruin?":
      transferStT as "Transfer from Self to Target",
      transferTtS as "Transfer from Target to Self"
      to self;

    [On Dialog Answer transferStT]
    require (self.status.Ruin) > 0 and (self.status.Ruin) < N then
      inflict (self.status.Ruin) Ruin on target and lose all Ruin on self;
    require (self.status.Ruin) >= N then
      inflict N Ruin on target and lose N Ruin on self;

    [On Dialog Answer transferTtS]
    require (target.status.Ruin) > 0 and (target.status.Ruin) < N then
      gain (target.status.Ruin) Ruin on self and lose all Ruin on target;
    require (target.status.Ruin) >= N then
      gain N Ruin on self and lose N Ruin on target;
