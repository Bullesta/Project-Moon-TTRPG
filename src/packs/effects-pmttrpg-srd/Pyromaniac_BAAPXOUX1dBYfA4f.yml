  positive: >-
    <p>Transfer up to [N] already present stacks of Burn from self to the target
    OR from target to self.</p>
  negative: ''
  macro:
    uuid: ''
  customNotes: ''
  easyEffects: |-
    [On Clash Win With Attack]
    create dialog "Pyromaniac: Transfer Burn?":
      transferStT as "Transfer from Self to Target",
      transferTtS as "Transfer from Target to Self"
      to self;

    [On Dialog Answer transferStT]
    require (self.status.Burn) > 0 and (self.status.Burn) < N then
      inflict (self.status.Burn) Burn on target and lose all Burn on self;
    require (self.status.Burn) >= N then
      inflict N Burn on target and lose N Burn on self;

    [On Dialog Answer transferTtS]
    require (target.status.Burn) > 0 and (target.status.Burn) < N then
      gain (target.status.Burn) Burn on self and lose all Burn on target;
    require (target.status.Burn) >= N then
      gain N Burn on self and lose N Burn on target;
