  procCondition: ''
  positive: >-
    <p>Transfer up to [N] already present stacks of Bleed from self to the
    target OR from target to self.</p>
  negative: ''
  macro:
    uuid: ''
  customNotes: ''
  easyEffects: |-
    [On Clash Win With Attack]
    create dialog "Hemomaniac: Transfer Bleed?":
      transferStT as "Transfer from Self to Target",
      transferTtS as "Transfer from Target to Self"
      to self;

    [On Dialog Answer transferStT]
    require (self.status.Bleed) > 0 and (self.status.Bleed) < N then
      inflict (self.status.Bleed) Bleed on target and lose all Bleed on self;
    require (self.status.Bleed) >= N then
      inflict N Bleed on target and lose N Bleed on self;

    [On Dialog Answer transferTtS]
    require (target.status.Bleed) > 0 and (target.status.Bleed) < N then
      gain (target.status.Bleed) Bleed on self and lose all Bleed on target;
    require (target.status.Bleed) >= N then
      gain N Bleed on self and lose N Bleed on target;
