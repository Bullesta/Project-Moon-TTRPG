name: Build & Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/module/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dependencies
        run: npm ci

      - name: Install jsdoc-to-markdown
        run: npm install --no-save jsdoc-to-markdown

      - name: Generate API docs from JSDoc
        run: node tools/generate-docs.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force